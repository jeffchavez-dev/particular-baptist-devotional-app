<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Parchment background -->
  <rect width="100" height="100" rx="6" fill="#f5f0e8"/>
  <!-- Outer border -->
  <rect x="4" y="4" width="92" height="92" rx="4" fill="none" stroke="#3d2e1e" stroke-width="2.2"/>
  <!-- Inner border -->
  <rect x="9" y="9" width="82" height="82" rx="2" fill="none" stroke="#3d2e1e" stroke-width="0.7"/>
  <!-- Corner diamonds -->
  <polygon points="4,4 9,6.5 4,9 -1,6.5" fill="#3d2e1e" transform="translate(4,4)"/>
  <polygon points="0,0 5,2.5 0,5 -5,2.5" fill="#3d2e1e" transform="translate(96,6.5)"/>
  <polygon points="0,0 5,2.5 0,5 -5,2.5" fill="#3d2e1e" transform="translate(96,88.5)"/>
  <polygon points="0,0 5,2.5 0,5 -5,2.5" fill="#3d2e1e" transform="translate(4,88.5)"/>
  <!-- Top divider with ornament -->
  <line x1="16" y1="31" x2="40" y2="31" stroke="#3d2e1e" stroke-width="0.7"/>
  <line x1="60" y1="31" x2="84" y2="31" stroke="#3d2e1e" stroke-width="0.7"/>
  <text x="50" y="34.5" font-family="Georgia,serif" font-size="8" text-anchor="middle" fill="#3d2e1e">✦</text>
  <!-- P.B. monogram -->
  <text x="50" y="65" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#3d2e1e" letter-spacing="1">P.B.</text>
  <!-- Bottom divider with year -->
  <line x1="16" y1="72" x2="84" y2="72" stroke="#3d2e1e" stroke-width="0.7"/>
  <text x="50" y="85" font-family="Georgia,serif" font-size="8.5" text-anchor="middle" fill="#6b5744" letter-spacing="2.5">1689</text>
</svg>
