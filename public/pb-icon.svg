<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solid dark background -->
  <rect width="100" height="100" fill="#1a1410"/>

  <!-- Gold inner border frame -->
  <rect x="6" y="6" width="88" height="88" rx="3" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.6"/>

  <!-- Thin inner inset rule -->
  <rect x="10" y="10" width="80" height="80" rx="1.5" fill="none" stroke="#c9a84c" stroke-width="0.4" opacity="0.35"/>

  <!-- Top ornament line pair -->
  <line x1="18" y1="27" x2="40" y2="27" stroke="#c9a84c" stroke-width="0.7" opacity="0.55"/>
  <line x1="60" y1="27" x2="82" y2="27" stroke="#c9a84c" stroke-width="0.7" opacity="0.55"/>
  <!-- Diamond center ornament -->
  <polygon points="50,23.5 52.5,27 50,30.5 47.5,27" fill="#c9a84c" opacity="0.7"/>

  <!-- P.B. monogram — parchment, bold serif -->
  <text
    x="50" y="64"
    font-family="Georgia,'Times New Roman',serif"
    font-size="30"
    font-weight="bold"
    text-anchor="middle"
    fill="#f5f0e8"
    letter-spacing="2"
  >P.B.</text>

  <!-- Bottom rule -->
  <line x1="18" y1="72" x2="82" y2="72" stroke="#c9a84c" stroke-width="0.7" opacity="0.55"/>

  <!-- Year — gold, small caps style -->
  <text
    x="50" y="84"
    font-family="Georgia,'Times New Roman',serif"
    font-size="8"
    text-anchor="middle"
    fill="#c9a84c"
    letter-spacing="3"
    opacity="0.85"
  >1689</text>
</svg>
